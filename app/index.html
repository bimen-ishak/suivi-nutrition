<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4EE" />
    <script>
      // Applique le thème avant l'affichage, pour éviter un flash de l'autre couleur
      try {
        if (localStorage.getItem('theme') === 'halloween') document.documentElement.dataset.theme = 'halloween';
      } catch (e) {}
    </script>
    <title>Suivi Nutrition</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
