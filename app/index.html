<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%pwa-192x192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icone-ecran-accueil.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF0EB" />
    <meta name="application-name" content="KOUL" />
    <meta name="apple-mobile-web-app-title" content="KOUL" />
    <!-- App installée sur iPhone : la barre de l'heure suit le fond de la page -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Sélectionne le manifeste avant le chargement de React, y compris au lancement d'un raccourci.
      const requestedMode = new URLSearchParams(location.search).get('mode');
      let savedMode;
      try { savedMode = localStorage.getItem('nutritionMode'); } catch (e) {}
      if (requestedMode === 'bulk' || (requestedMode !== 'cut' && savedMode === 'bulk')) {
        document.querySelector('link[rel="manifest"]').setAttribute('href', '%BASE_URL%bulk.webmanifest');
        document.querySelector('link[rel="icon"]').setAttribute('href', '%BASE_URL%koul-bulk-192.png');
        document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', '%BASE_URL%koul-bulk-192.png');
      }
      // Applique le thème avant l'affichage, pour éviter un flash de l'autre couleur
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
        }
      } catch (e) {}
      // Langue et sens d'écriture avant l'affichage, pour éviter un flash de gauche à droite
      try {
        const language = localStorage.getItem('language');
        if (language === 'en') document.documentElement.lang = 'en';
        if (language === 'ar-EG') {
          document.documentElement.lang = 'ar-EG';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
    <title>KOUL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
