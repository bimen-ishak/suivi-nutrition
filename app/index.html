<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/koul-bulk-192.png" />
    <link rel="apple-touch-icon" href="/koul-bulk-192.png" />
    <link rel="manifest" href="%BASE_URL%bulk.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF1F5" />
    <script>
      // Applique le thème avant l'affichage, pour éviter un flash de l'autre couleur
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1319');
        }
      } catch (e) {}
      // Langue et sens d'écriture avant l'affichage, pour éviter un flash de gauche à droite
      try {
        const language = localStorage.getItem('language');
        if (language === 'en') document.documentElement.lang = 'en';
        if (language === 'ar-EG') {
          document.documentElement.lang = 'ar-EG';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
    <title>KOUL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
