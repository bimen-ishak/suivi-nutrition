<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/icone-ecran-accueil.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF1F5" />
    <script>
      // Applique le thème avant l'affichage, pour éviter un flash de l'autre couleur
      try {
        if (localStorage.getItem('theme') === 'halloween') document.documentElement.dataset.theme = 'halloween';
      } catch (e) {}
      // Langue et sens d'écriture avant l'affichage, pour éviter un flash de gauche à droite
      try {
        if (localStorage.getItem('language') === 'ar-EG') {
          document.documentElement.lang = 'ar-EG';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
    <title>Suivi Nutrition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
