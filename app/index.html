<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4EE" />
    <script>
      // Applique le thème avant l'affichage, pour éviter un flash de l'autre couleur
      try {
        if (localStorage.getItem('theme') === 'halloween') document.documentElement.dataset.theme = 'halloween';
      } catch (e) {}
      // Icône choisie par l'utilisateur, lue avant que iOS ne regarde la page
      try {
        var icon = localStorage.getItem('appIcon');
        if (icon) document.querySelector('link[rel="apple-touch-icon"]').href = icon;
      } catch (e) {}
    </script>
    <title>Suivi Nutrition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
